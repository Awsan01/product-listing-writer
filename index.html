/* VOICE work tool, calm and exact, for people who sell online; dressed in HELA Tech's brand
   IDEA a listing proof sheet: each product is a plate with its photo beside its finished listing
   PICTURE the uploaded product photos beside their live listings
   COLOUR HELA green #34c87c to teal #00b090, dark teal-black #0d1c22, white cards on light grey #f4f6f5, a touch of orange #ff5e13

:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .18s,border-color .18s,color .18s,transform .12s}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.band{padding-block:clamp(22px,3.5vw,44px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1180px;margin:0 auto;position:relative}
.hero{position:relative;overflow:hidden;background:var(--dark);color:#fff;padding:clamp(28px,4vw,52px) max(5vw,16px) 92px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-weight:400;font-size:clamp(32px,5vw,50px);line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
.lead{color:#b7cbc5;margin:12px 0 0;max-width:60ch}
.hact{display:flex;align-items:center;gap:10px}
.ai{display:flex;align-items:center;gap:8px;font-size:14px;color:#b7cbc5;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#ffc069;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(52,200,124,.25)}
.dot.off{background:var(--orange)}
.ghost{height:44px;min-width:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500}
.ghost:hover{border-color:var(--green);color:var(--gink)}
.hero .ghost{background:transparent;border-color:rgba(255,255,255,.28);color:#fff}
.hero .ghost:hover{border-color:var(--green);color:var(--green)}
.setup{padding-top:0}
.drop{position:relative;margin-top:-62px;display:grid;place-items:center;text-align:center;gap:6px;padding:30px 20px;border:2px dashed var(--green);border-radius:22px;background:var(--card);box-shadow:var(--sh);transition:background-color .2s,border-color .2s}
.drop:hover,.drop.over{background:var(--gtint)}
.drop svg{width:46px;height:46px;color:var(--gink)}
.drop b{font-size:clamp(18px,2.2vw,22px);font-weight:500}
.drop span{font-size:14px;color:var(--mut)}
.pick{font-style:normal;margin-top:8px;height:46px;line-height:46px;padding:0 24px;border-radius:999px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--dark);font-weight:600}
#file{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.drop:focus-within{outline:2px solid var(--green);outline-offset:3px}
.busy{opacity:.6;pointer-events:none}
.opts{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px 24px}
.opt>span{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--gtint);border-color:var(--green);color:var(--gink)}
.seg button:hover{border-color:var(--green)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-bottom:18px}
.bar h2{font-size:21px;font-weight:500;margin:0;margin-inline-end:auto}
.bar .msg{font-size:14px;flex-basis:100%}
.prim{height:44px;padding:0 22px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--dark);font-weight:600}
.prim:hover{filter:brightness(1.06)}
.prim:disabled{opacity:.45;cursor:not-allowed;filter:none}
.plates{display:flex;flex-direction:column;gap:18px}
.plate{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:24px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}
@media(max-width:760px){.plate{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px}
.ph{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--orange);color:var(--dark);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.side label{font-size:13px;color:var(--mut)}
.notes{width:100%;min-height:64px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--field);padding:10px 12px;font-size:16px;line-height:1.5}
.notes:focus{border-color:var(--green);outline:none}
.pb{display:flex;gap:8px;flex-wrap:wrap}
.pb .prim{flex:1}
.seen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut)}
.seen i{font-style:normal;background:var(--gtint);color:var(--gink);padding:2px 10px;border-radius:999px}
.out{display:flex;flex-direction:column;gap:12px}
.ltabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ltabs button{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px}
.ltabs button[data-st=run]::after{content:'…'}
.ltabs button[data-st=err]{color:var(--oink);border-color:var(--oink)}
.ltabs button[data-st=err]::after{content:' !'}
.ltabs button[aria-selected=true]{background:var(--tabbg);color:var(--tabink);border-color:var(--tabbg)}
.ltabs .ghost{height:38px;margin-inline-start:auto;font-size:14px}
.f{border-top:1px solid var(--line);padding-top:10px}
.fh{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.fh b{font-weight:500;color:var(--gink);margin-inline-end:auto}
.cnt{font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt.over{color:var(--oink);font-weight:600}
.cp{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px}
.cp:hover{border-color:var(--green);color:var(--gink)}
.f textarea{width:100%;border:0;background:transparent;resize:none;overflow:hidden;padding:6px 0 2px;font-size:16px;line-height:1.7;display:block}
.f textarea:focus{outline:none;background:var(--field);border-radius:8px}
.f.t textarea{font-size:20px;font-weight:500;line-height:1.4}
.wait{display:flex;flex-direction:column;gap:12px;padding:8px 0}
.wait p{margin:0;color:var(--mut);font-size:15px}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:2px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
[dir=rtl] .prog i{animation-name:slider}
@keyframes slider{0%{transform:translateX(110%)}100%{transform:translateX(-260%)}}
.err{color:var(--oink);font-size:14px}
.terr{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:8px 0}
.terr .err{margin:0}
.idle{color:var(--mut);font-size:15px;margin:0;padding:8px 0}
.empty{text-align:center;color:var(--mut);padding:30px 10px;border:1px dashed var(--line);border-radius:16px;background:var(--card)}
.foot{color:var(--mut);font-size:13px;margin-top:18px}
.sig{padding-top:0;text-align:center;color:var(--mut);font-size:13px}
.sig .wrap{border-top:1px solid var(--line);padding-top:18px}
@media(prefers-reduced-motion:reduce){.prog i{animation:none}button{transition:none}}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap hd">
    <div>
      <h1 id="h1">كاتب أوصاف المنتجات</h1>
      <p class="lead" id="lead">ارفع صور منتجاتك واحصل على عنوان ووصف وكلمات مفتاحية ومنشور إنستغرام، بالعربية والإنجليزية والتركية.</p>
    </div>
    <div class="hact"><span class="ai"><i class="dot" id="dot"></i><span id="aiTxt">جارٍ الاتصال…</span></span><button type="button" class="ghost" id="langBtn">EN</button></div>
  </div>
</header>
<section class="band setup"><div class="wrap">
  <div class="drop" id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
    <b id="dropT">اسحب صور المنتجات هنا أو اخترها من جهازك</b>
    <span id="dropS">حتى 10 صور · صورة واحدة لكل منتج · JPG أو PNG أو WebP</span>
    <em class="pick" id="pickT">اختيار الصور</em>
    <input type="file" id="file" accept="image/*" multiple aria-label="اختيار الصور">
  </div>
  <div class="opts" id="opts"></div>
</div></section>
<main class="band" style="padding-top:0"><div class="wrap">
  <div class="bar">
    <h2 id="listH">المنتجات</h2>
    <button type="button" class="prim" id="genAll">توليد الكل</button>
    <button type="button" class="ghost" id="copyCsv">نسخ CSV</button>
    <button type="button" class="ghost" id="dlCsv">تنزيل CSV</button>
    <button type="button" class="ghost" id="clearAll">مسح الكل</button>
    <span class="msg" id="msg" aria-live="polite"></span>
  </div>
  <div class="plates" id="plates"></div>
  <p class="foot" id="foot"></p>
</div></main>
<footer class="band sig"><div class="wrap">Built by Awsan Khaled</div></footer>

function selLangs(){return LANGS.filter(l=>S.langs[l])}
function joinList(arr,l){return (arr||[]).join(l==='ar'?'، ':', ')}
function splitList(s){return String(s||'').split(/[,،\n]+/).map(x=>x.trim()).filter(Boolean)}
function fieldText(o,k,l){const v=o[k];if(v==null)return '';if(k==='features')return v.map(x=>'• '+x).join('\n');if(k==='keywords')return joinList(v,l);if(k==='hashtags')return v.join(' ');return v}
function setField(o,k,txt){if(k==='features')o[k]=String(txt).split('\n').map(x=>x.replace(/^[•\-\*]\s*/,'').trim()).filter(Boolean);else if(k==='keywords')o[k]=splitList(txt);else if(k==='hashtags')o[k]=String(txt).split(/\s+/).filter(Boolean);else o[k]=txt}

const str=v=>typeof v==='string'?v.trim():'';
const arr=v=>Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean):(typeof v==='string'?splitList(v):[]);
function take(p,lang,j,ui){
  const L=j&&j.listing;if(!L||typeof L!=='object')return false;
  const o={};
  for(const k of KEYS){if(L[k]==null)continue;o[k]=['features','keywords','hashtags'].includes(k)?arr(L[k]):str(L[k])}
  if(!o.title&&!o.description)return false;
  if(o.hashtags)o.hashtags=o.hashtags.map(h=>h[0]==='#'?h:'#'+h.replace(/\s+/g,'_'));
  p.out[lang]=o;
  if(!p.seen&&j.seen)p.seen={product:{[ui]:str(j.seen.product)},items:{[ui]:arr(j.seen.items).slice(0,6)}};
  return true;
}
// At most MAX_PARALLEL requests run at a time on the page; the others wait their turn.
const pool={n:0,q:[]};
function slot(signal){return new Promise((res,rej)=>{
  const go=()=>{signal.removeEventListener('abort',quit);pool.n++;res()};
  const quit=()=>{pool.q=pool.q.filter(f=>f!==go);rej(new DOMException('Aborted','AbortError'))};
  if(signal.aborted)return quit();
  if(pool.n<MAX_PARALLEL)go();else{pool.q.push(go);signal.addEventListener('abort',quit,{once:true})}
})}
function release(){pool.n--;const next=pool.q.shift();if(next)next()}
function settings(p){return {ui:S.lang,tone:S.tone,len:S.len,features:S.inc.features?'1':'0',seo:S.inc.seo?'1':'0',social:S.inc.social?'1':'0',quality:S.q,notes:p.notes.trim().slice(0,600)}}
// One photo and one language per request. The server builds the prompt and calls the Claude API.
async function request(p,lang,o,signal){
  await slot(signal);
  try{
    const fd=new FormData();
    fd.append('image',p.file,p.file.type==='image/png'?'photo.png':'photo.jpg');
    fd.append('lang',lang);for(const k in o)fd.append(k,o[k]);
    let r,j=null;
    try{r=await fetch('api/generate.php',{method:'POST',body:fd,signal});j=await r.json().catch(()=>null)}
    catch(e){if(signal.aborted)throw e;return {error:'network'}}
    if(signal.aborted)throw new DOMException('Aborted','AbortError');
    if(r.ok&&j&&j.listing)return j;
    return {error:j&&typeof j.error==='string'?j.error:r.status===429?'rate_limited':r.status>=500?'busy':'other',retry:(j&&+j.retry_after)||+r.headers.get('Retry-After')||0};
  }finally{release()}
}
function rasterize(){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=600;c.height=600;c.getContext('2d').drawImage(img,0,0,600,600);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png')}catch(e){rej(e)}};img.onerror=()=>rej(new Error('img'));img.src=EX_URL})}

async function generate(p,only){
  const jobs0=p.jobs||{};
  if(only?(jobs0[only]&&jobs0[only].st==='run'):p.status==='run')return null;
  if(!selLangs().length){S.langs.ar=true;save();renderOpts()}
  if(!p.file&&p.example){try{p.file=await rasterize()}catch(e){p.status='err';p.err='example';renderPlate(p);return {st:p.status,errs:['example']}}}
  const langs=only?[only]:selLangs(),o=settings(p);
  if(p.status!=='run'){p.ctl=new AbortController();p.t0=Date.now();p.stopped=false}
  if(!only){p.keepOut=p.out;p.keepSeen=p.seen;p.out={};p.seen=null;p.jobs={};p.err='';p.picked=false;if(!langs.includes(p.tab))p.tab=langs[0]}
  for(const l of langs)p.jobs[l]={st:'run',prev:only?jobs0[l]:null};
  p.status='run';
  if(!p.timer)p.timer=setInterval(()=>{const el=document.querySelector('#'+p.id+' .secs');if(el)el.textContent=t('secs')(Math.round((Date.now()-p.t0)/1000))},1000);
  renderPlate(p);renderBar();
  const ctl=p.ctl,errs=[];
  await Promise.all(langs.map(async l=>{
    let j;
    try{j=await request(p,l,o,ctl.signal)}
    catch(e){if(ctl.signal.aborted){const prev=p.jobs[l]&&p.jobs[l].prev;if(prev)p.jobs[l]=prev;else delete p.jobs[l];return}j={error:'other'}}
    if(j.error){errs.push(j.error);p.jobs[l]={st:'err',err:j.error,retryAt:j.retry?Date.now()+j.retry*1000:0};if(j.error==='paused'&&aiState!=='off'){aiState='off';renderStatus()}}
    else if(take(p,l,j,o.ui)){p.jobs[l]={st:'done'};if(aiState!=='on'){aiState='on';renderStatus()}if(!p.picked&&!p.out[p.tab])p.tab=l}
    else{errs.push('format');p.jobs[l]={st:'err',err:'format'}}
    renderPlate(p);
  }));
  settle(p);
  return {st:p.status,errs};
}
// Runs when a product's last request ends. Keeps what arrived; after Stop, languages that didn't arrive keep
// their earlier listing, and when every language failed the earlier listing comes back with the error.
function settle(p){
  const jobs=p.jobs||{};
  if(Object.values(jobs).some(j=>j.st==='run'))return;
  clearInterval(p.timer);p.timer=null;p.ctl=null;
  if(p.stopped&&p.keepOut){p.out=Object.assign({},p.keepOut,p.out);for(const l in jobs)if(p.out[l])delete jobs[l]}
  const got=Object.keys(p.out).length;
  if(got){p.status='done';for(const l in jobs)if(jobs[l].st!=='err')delete jobs[l]}
  else if(p.stopped){p.jobs={};p.status='idle'}
  else{const e=Object.values(jobs).find(j=>j.st==='err')||{};p.status='err';p.err=e.err||'other';p.retryAt=e.retryAt||0;p.out=p.keepOut||{};p.jobs={}}
  if(!p.seen)p.seen=p.keepSeen||null;
  p.keepOut=p.keepSeen=null;
  renderPlate(p);renderBar();
}
function errText(code,retryAt){
  const E=T[S.lang].err;
  if(code==='rate_limited'&&retryAt-Date.now()>90000){
    const d=new Date(retryAt),at=d.toLocaleTimeString(S.lang==='ar'?'ar-u-nu-latn':'en',{hour:'numeric',minute:'2-digit'});
    return d.toDateString()===new Date().toDateString()?E.rateAt(at):E.rateTomorrow(at);
  }
  if(code==='too_large')return E.big;
  return typeof E[code]==='string'?E[code]:E.other;
}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('decode'));i.src=src})}
async function toJpeg(file){
  const src=URL.createObjectURL(file);
  try{
    const img=await loadImg(src);
    const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height;
    if(!w0||!h0)throw new Error('size');
    const k=Math.min(1,MAX_SIDE/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
    if(!blob)throw new Error('encode');
    return blob;
  }finally{URL.revokeObjectURL(src)}
}
async function addFiles(list){
  const files=[...(list||[])];
  if(!files.length)return;
  let room=10-products.filter(p=>!p.example).length,skipped=false,notImg=false,added=0;
  const drop=$('#drop');drop.classList.add('busy');flash(t('preparing'));
  for(const f of files){
    if(room<=0){skipped=true;break}
    const looksImage=(f.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif|bmp|avif)$/i.test(f.name||'')||!f.type;
    if(!looksImage){notImg=true;continue}
    const p={id:'p'+(++seq)+Date.now().toString(36),example:false,url:'',file:null,notes:'',status:'idle',tab:'ar',seen:null,out:{}};
    try{const jpg=await toJpeg(f);p.file=jpg;p.url=URL.createObjectURL(jpg);if(jpg.size>MAX_BYTES){p.status='err';p.err='big'}}
    catch(e){if(!(f.type||'').startsWith('image/')&&!/\.(jpe?g|png|webp|gif|heic|heif|bmp|avif)$/i.test(f.name||'')){notImg=true;continue}p.status='err';p.err='type';p.url=EX_URL.replace('#f3e6ea','#d9e2ea')}
    products.push(p);room--;added++;
  }
  drop.classList.remove('busy');
  renderPlates();renderBar();
  if(skipped)flash(t('tooMany'),true);else if(notImg)flash(t('notImage'),true);else $('#msg').textContent='';
  if(added){const all=document.querySelectorAll('.plate:not(#ex)');const last=all[all.length-added];if(last)last.scrollIntoView({behavior:'smooth',block:'start'})}
}

  }).join('');
}
function tabsOf(p){const j=p.jobs||{};return LANGS.filter(l=>p.out[l]||j[l])}
function waitHTML(p,bar){const L=T[S.lang];return '<div class="wait"><p>'+L.analyzing+' <span class="secs">'+L.secs(Math.round((Date.now()-(p.t0||Date.now()))/1000))+'</span></p>'+(bar?'<div class="prog"><i></i></div>':'')+'</div>'}
function tabBody(p){
  const j=(p.jobs||{})[p.tab];
  if(p.out[p.tab])return fieldsHTML(p);
  if(j&&j.st==='err')return '<div class="terr"><p class="err">'+esc(errText(j.err,j.retryAt))+'</p><button type="button" class="ghost" data-retry="'+p.tab+'">'+T[S.lang].retry+'</button></div>';
  return waitHTML(p,false);
}
function plateHTML(p){
  const L=T[S.lang],jobs=p.jobs||{};
  const seen=p.seen?'<div class="seen"><span>'+L.seen+'</span>'+((p.seen.items[S.lang]||p.seen.items.ar||p.seen.items.en||[]).map(x=>'<i>'+esc(x)+'</i>').join(''))+'</div>':'';
  const langs=tabsOf(p),has=Object.keys(p.out).length;
  if(langs.length&&!langs.includes(p.tab))p.tab=langs.find(l=>p.out[l])||langs[0];
  let out='';
  if(p.status==='run'&&!langs.some(l=>p.out[l]||jobs[l].st==='err'))out=waitHTML(p,true);
  else if(langs.length){
    out='<div class="ltabs" role="tablist">'+langs.map(l=>{const st=p.out[l]?'':jobs[l].st;return '<button type="button" role="tab" data-tab="'+l+'"'+(st==='run'||st==='err'?' data-st="'+st+'"':'')+' aria-selected="'+(l===p.tab)+'">'+L.lname[l]+'</button>'}).join('')+(p.out[p.tab]?'<button type="button" class="ghost" data-copyall>'+L.copyAll+'</button>':'')+'</div>'+(p.status==='run'?'<div class="prog"><i></i></div>':'')+tabBody(p);
  } else if(p.status!=='err')out='<p class="idle">'+L.idle+'</p>';
  if(p.status==='err')out+='<p class="err">'+esc(errText(p.err,p.retryAt))+'</p>';
  const btn=p.status==='run'?'<button type="button" class="prim" data-stop>'+L.stop+'</button>':'<button type="button" class="prim" data-gen'+(p.err==='type'||p.err==='big'?' disabled':'')+'>'+(has?L.regen:L.gen)+'</button>';
  return '<article class="plate" id="'+p.id+'"><div class="side"><div class="ph"><img src="'+esc(p.url)+'" alt="">'+(p.example?'<span class="tag">'+L.example+'</span>':'')+'</div><label for="n-'+p.id+'">'+L.notesL+'</label><textarea class="notes" id="n-'+p.id+'" dir="auto" maxlength="600" placeholder="'+esc(L.notesPh)+'">'+esc(p.notes)+'</textarea><div class="pb">'+btn+'<button type="button" class="ghost" data-del>'+L.del+'</button></div>'+seen+'</div><div class="out">'+out+'</div></article>';
}

}
let flashT=null;
function flash(s,warn){const m=$('#msg');m.textContent=s;m.style.color=warn?'var(--oink)':'var(--gink)';clearTimeout(flashT);flashT=setTimeout(()=>{m.textContent=''},4000)}
async function copyText(s,btn){
  try{await navigator.clipboard.writeText(s);if(btn){if(!btn.dataset.label)btn.dataset.label=btn.textContent;btn.textContent=t('copied');clearTimeout(btn._t);btn._t=setTimeout(()=>{btn.textContent=btn.dataset.label},1400)}return true}
  catch(e){flash(t('copyFail'),true);return false}
}
function csv(){
  const L=T[S.lang],cols=['product','language'].concat(KEYS);
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[cols.join(',')];
  products.forEach((p,i)=>{for(const l of LANGS){const o=p.out[l];if(!o)continue;rows.push([q((i+1)+(p.notes?' - '+p.notes:'')),q(l)].concat(KEYS.map(k=>q(k==='features'?(o[k]||[]).join(' | '):fieldText(o,k,l)))).join(','))}});
  return rows.length>1?rows.join('\r\n'):'';
}
function allText(p){const L=T[S.lang],o=p.out[p.tab]||{};return KEYS.filter(k=>o[k]!=null).map(k=>L.fields[k]+'\n'+fieldText(o,k,p.tab)).join('\n\n')}

const onPick=e=>{const fl=e.target.files;if(!fl||!fl.length)return;const copy=[...fl];e.target.value='';addFiles(copy)};
$('#file').addEventListener('change',onPick);
const drop=$('#drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
// A photo dropped next to the drop area must not open in the tab: that would lose every listing.
window.addEventListener('dragover',e=>{if(!drop.contains(e.target)){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='none'}});
window.addEventListener('drop',e=>{if(!drop.contains(e.target))e.preventDefault()});
$('#opts').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]');if(!b)return;const name=b.parentElement.dataset.opt,v=b.dataset.v;
  if(name==='langs'||name==='inc'){const o=S[name];o[v]=!o[v];if(!Object.values(o).some(Boolean))o[v]=true}else S[name]=v;
  save();renderOpts();
});
$('#plates').addEventListener('click',e=>{
  const plate=e.target.closest('.plate');if(!plate)return;const p=products.find(x=>x.id===plate.id);if(!p)return;
  if(e.target.closest('[data-gen]')){generate(p);return}
  const rt=e.target.closest('[data-retry]');if(rt){generate(p,rt.dataset.retry);return}
  if(e.target.closest('[data-stop]')){if(p.ctl&&Date.now()-p.t0>700){p.stopped=true;p.ctl.abort();if(batch&&batch.cur===p)batch.cancel=true}return} // Stop takes the button's place: a double-click must not stop the run it started
  if(e.target.closest('[data-del]')){if(p.ctl){p.stopped=true;p.ctl.abort()}clearInterval(p.timer);if(!p.example&&p.url.startsWith('blob:'))URL.revokeObjectURL(p.url);products=products.filter(x=>x!==p);renderPlates();renderBar();return}
  const tb=e.target.closest('[data-tab]');if(tb){p.tab=tb.dataset.tab;p.picked=true;renderPlate(p);return}
  const cp=e.target.closest('[data-copy]');if(cp){const ta=plate.querySelector('textarea[data-k="'+cp.dataset.copy+'"]');copyText(ta?ta.value:'',cp);return}
  const ca=e.target.closest('[data-copyall]');if(ca){copyText(allText(p),ca)}
});
$('#plates').addEventListener('input',e=>{
  const plate=e.target.closest('.plate');if(!plate)return;const p=products.find(x=>x.id===plate.id);if(!p)return;
  if(e.target.classList.contains('notes')){p.notes=e.target.value;return}
  const k=e.target.dataset.k;if(!k||!p.out[p.tab])return;
  setField(p.out[p.tab],k,e.target.value);fit(e.target);
  const lim=LIMIT[k];if(lim){const c=e.target.parentElement.querySelector('.cnt');if(c){c.textContent=e.target.value.length+'/'+lim;c.classList.toggle('over',e.target.value.length>lim)}}
});
$('#genAll').addEventListener('click',async()=>{
  if(batch)return;
  const todo=products.filter(p=>!p.example&&p.status!=='run'&&p.err!=='type'&&p.err!=='big'&&!Object.keys(p.out).length);
  const list=todo.length?todo:products.filter(p=>!p.example&&p.status!=='run'&&p.err!=='type'&&p.err!=='big');
  if(!list.length)return;
  batch={i:0,n:list.length};
  for(const p of list){if(!products.includes(p))continue;batch.i++;batch.cur=p;renderBar();const r=await generate(p);if(batch.cancel||r&&r.errs.some(c=>c==='rate_limited'||c==='paused'))break}
  batch=null;renderBar();
});
$('#copyCsv').addEventListener('click',async e=>{const c=csv();if(!c){flash(t('noData'),true);return}if(await copyText(c,null))flash(t('csvCopied'))});
$('#dlCsv').addEventListener('click',()=>{
  const c=csv();if(!c){flash(t('noData'),true);return}
  const url=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='product-listings.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);flash(t('saved'));
});
$('#clearAll').addEventListener('click',()=>{products.forEach(p=>{if(p.ctl){p.stopped=true;p.ctl.abort()}clearInterval(p.timer);if(!p.example&&p.url.startsWith('blob:'))URL.revokeObjectURL(p.url)});products=[];renderPlates();renderBar()});
$('#langBtn').addEventListener('click',()=>{S.lang=S.lang==='ar'?'en':'ar';save();applyLang()});
window.addEventListener('resize',()=>fitAll());
applyLang();
}
</script>
</body>
</html>
